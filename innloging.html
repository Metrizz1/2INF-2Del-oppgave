<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administratorinnlogging</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <div class="card">
      <div class="brand">
        <h1>Administratorpanel</h1>
        <p>Logg inn for å gå videre til bekreftelse med kode sendt på e-post.</p>
      </div>

      <section id="login-section">
        <h2>Innlogging</h2>

        <form id="login-form">
          <div class="form-group">
            <label for="email">E-postadresse</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="admin@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Passord</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Skriv inn passord"
              required
            />
          </div>

          <button type="submit" class="btn primary">Logg inn</button>
        </form>
      </section>

      <section id="otp-section" class="hidden">
        <h2>Bekreftelseskode</h2>
        <p class="section-text">
          Skriv inn den 6-sifrede koden som ble sendt til e-postadressen din.
        </p>

        <form id="otp-form">
          <div class="form-group">
            <label for="otp">Bekreftelseskode</label>
            <input
              type="text"
              id="otp"
              name="otp"
              maxlength="6"
              inputmode="numeric"
              placeholder="000000"
              required
            />
          </div>

          <button type="submit" class="btn primary">Bekreft kode</button>
          <button type="button" id="back-btn" class="btn secondary">Tilbake</button>
        </form>
      </section>

      <section id="dashboard-section" class="hidden">
        <h2>Tilgang</h2>
        <p id="greeting-text" class="section-text"></p>
        <div class="access-box">
          <strong>Rolle:</strong> <span id="role-text"></span>
        </div>
      </section>

      <div id="message-box" class="message hidden"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
